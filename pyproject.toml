[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xi"
version = "1.2.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "prompt_toolkit>=3.0",
    "pefile",
    "capstone",
    "pillow>=12.2.0",
    "pymysql>=1.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
gui-check = ["playwright>=1.60"]

[project.scripts]
xi = "xi.xi_cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/xi"]
# Bundle the prebuilt navmesh native lib (Recast/Detour) so installs ship it.
artifacts = ["src/xi/libs/*"]
